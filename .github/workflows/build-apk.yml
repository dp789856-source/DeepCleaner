name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Generate Unique Release Tag
        id: tag
        run: echo "release_tag=v1.0.$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "Deep Cleaner & Security (${{ steps.tag.outputs.release_tag }})"
          body: |
            ### 🚀 Deep Cleaner & Security Official Release
            - Automated clean & scan architecture
            - Verified permissions dialog
            - Direct .apk download asset attached below
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}